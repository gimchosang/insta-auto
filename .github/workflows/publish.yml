name: 매일 발행

on:
  schedule:
    # 매시 정각(UTC)에 깨어나서, 지금 발행할 계정이 있는지 확인합니다.
    # 계정별 발행 시각은 accounts/*.json 의 publishAt (한국시간) 으로 정합니다.
    # 발행할 계정이 없으면 30초 안에 끝나므로 부담이 없습니다.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '시간과 상관없이 지금 전부 발행'
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install --no-audit --no-fund

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum fonts-noto-cjk
          sudo fc-cache -f

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 발행 실행
        env:
          # 시크릿 전체를 넘겨줍니다. 계정을 늘려도 이 파일은 그대로입니다.
          ALL_SECRETS: ${{ toJSON(secrets) }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          node src/index.js ${{ inputs.force && '--force' || '' }}

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name  "insta-auto"
          git config user.email "actions@github.com"
          git add docs/img state/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "커밋할 변경사항 없음"
          else
            git commit -m "발행 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 실패 시 이슈 생성
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `발행 실패 — ${new Date().toISOString().slice(0, 10)}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'publish-failure',
            });
            if (existing.length) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['publish-failure'],
              body: `발행 워크플로가 실패했습니다.\n\n로그: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
